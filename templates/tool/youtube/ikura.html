<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>いくらTube</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100dvh; background: #0f0f0f; font-family: sans-serif; }
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      background: #181818;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px; font-size: .85rem;
      font-weight: 600; text-decoration: none; cursor: pointer;
      border: none; transition: background .15s;
    }
    .btn-back {
      background: #2a2a2a; color: #ccc;
    }
    .btn-back:hover { background: #3a3a3a; }
    .btn-open {
      background: #7c3aed; color: #fff;
    }
    .btn-open:hover { background: #6d28d9; }
    .title {
      flex: 1; font-size: .95rem; font-weight: 700; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    iframe {
      flex: 1; width: 100%; border: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="/tool/youtube" class="btn btn-back">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      戻る
    </a>
    <span class="title">いくらTube</span>
    <a href="https://script.google.com/macros/s/AKfycbydeW1mrUoaCINn9woVHuJZwcqTedmFIGmM6KQEDyRbJO5eHwzUn3_lBH5xRQh4Q1Qy/exec" target="_blank" rel="noopener" class="btn btn-open">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      サイトで開く
    </a>
  </div>
  <iframe
    src="https://script.google.com/macros/s/AKfycbydeW1mrUoaCINn9woVHuJZwcqTedmFIGmM6KQEDyRbJO5eHwzUn3_lBH5xRQh4Q1Qy/exec"
    allowfullscreen
    allow="autoplay; encrypted-media"
  ></iframe>
</body>
</html>
