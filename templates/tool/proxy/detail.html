{% extends "base.html" %}
{% block title %}{{ service.name }} — プロキシ — Choco-tube-plus{% endblock %}
{% block body_class %}proxy-detail-page{% endblock %}
{% block content %}
<main class="pd-main">
  <div class="pd-container">

    <!-- 戻るリンク -->
    <a href="/tool/proxy" class="pd-back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
      プロキシ一覧に戻る
    </a>

    <!-- ヒーロー画像 -->
    <div class="pd-hero">
      <img src="{{ service.image }}" alt="{{ service.name }}" class="pd-hero-img">
      <div class="pd-hero-overlay">
        <h1 class="pd-hero-title">{{ service.name }}</h1>
      </div>
    </div>

    <!-- 説明 -->
    {% if service.desc %}
    <div class="pd-desc-box">
      <span class="pd-desc-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        概要
      </span>
      <p class="pd-desc">{{ service.desc }}</p>
    </div>
    {% endif %}

    <!-- リンク一覧 -->
    <div class="pd-links-header">
      <span class="pd-links-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        インスタンス一覧
      </span>
      <span id="pdStatus" class="pd-status"></span>
    </div>
    <div id="pdList" class="pd-list"></div>

  </div>
</main>

<style>
.pd-main { padding: 20px 16px 56px; }
.pd-container { max-width: 780px; margin: 0 auto; }

/* 戻るリンク */
.pd-back {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .83rem; color: var(--text-secondary); text-decoration: none;
  margin-bottom: 20px; transition: color .15s;
}
.pd-back:hover { color: var(--text-primary); }

/* ヒーロー */
.pd-hero {
  position: relative; border-radius: 16px; overflow: hidden;
  margin-bottom: 20px; aspect-ratio: 16/6;
}
.pd-hero-img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.pd-hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.75) 0%, transparent 55%);
  display: flex; align-items: flex-end; padding: 20px 24px;
}
.pd-hero-title {
  font-size: 1.8rem; font-weight: 800; color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,.6); margin: 0;
}

/* 説明 */
.pd-desc-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color, rgba(128,128,128,.2));
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 20px;
}
.pd-desc-title {
  display: flex; align-items: center; gap: 6px;
  font-size: .85rem; font-weight: 700; color: var(--text-primary);
  margin-bottom: 8px;
}
.pd-desc-title svg { color: var(--accent-bright, #a78bfa); }
.pd-desc {
  font-size: .9rem; color: var(--text-secondary);
  line-height: 1.7; margin: 0;
}

/* リンクヘッダー */
.pd-links-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.pd-links-title {
  display: flex; align-items: center; gap: 7px;
  font-size: .95rem; font-weight: 700; color: var(--text-primary);
}
.pd-links-title svg { color: var(--accent-bright, #a78bfa); }
.pd-status { font-size: .82rem; color: var(--text-secondary); }

/* リスト */
.pd-list {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color, rgba(128,128,128,.2));
  border-radius: 12px; overflow: hidden;
}
.pd-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(128,128,128,.1);
  transition: background .15s;
}
.pd-item:last-child { border-bottom: none; }
.pd-item:hover { background: rgba(124,58,237,.05); }
.pd-num { font-size: .78rem; color: var(--text-secondary); min-width: 22px; text-align: right; flex-shrink: 0; }
.pd-item-url {
  flex: 1; min-width: 0; font-size: .88rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pd-item-url a { color: var(--text-primary); text-decoration: none; transition: color .15s; }
.pd-item-url a:hover { color: var(--accent-bright, #a78bfa); text-decoration: underline; }
.pd-open-btn {
  font-size: .75rem; font-weight: 600; flex-shrink: 0;
  padding: 3px 10px; border-radius: 6px;
  background: rgba(124,58,237,.15); color: var(--accent-bright, #a78bfa);
  border: 1px solid rgba(124,58,237,.3); text-decoration: none;
  transition: background .15s;
}
.pd-open-btn:hover { background: rgba(124,58,237,.28); }

/* スケルトン */
.pd-skeleton {
  height: 46px; margin: 6px 12px; border-radius: 8px;
  background: linear-gradient(90deg, var(--bg-tertiary, rgba(128,128,128,.1)) 25%, var(--bg-secondary) 50%, var(--bg-tertiary, rgba(128,128,128,.1)) 75%);
  background-size: 1200px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer { 0%{background-position:-1200px 0} 100%{background-position:1200px 0} }

.pd-empty { padding: 36px 20px; text-align: center; color: var(--text-secondary); font-size: .9rem; }

@media (max-width: 540px) {
  .pd-hero { aspect-ratio: 16/7; }
  .pd-hero-title { font-size: 1.4rem; }
}
</style>

<script>
(async () => {
  const listEl   = document.getElementById('pdList');
  const statusEl = document.getElementById('pdStatus');
  const GH_URL   = {{ gh_url | tojson }};

  // スケルトン
  for (let i = 0; i < 4; i++) {
    const sk = document.createElement('div');
    sk.className = 'pd-skeleton';
    listEl.appendChild(sk);
  }

  let links = [];
  try {
    const res = await fetch(GH_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    links = Array.isArray(data)
      ? data.map(i => typeof i === 'string' ? i : (i.url || i.uri || '')).filter(Boolean)
      : [];
  } catch (e) {
    listEl.innerHTML = `<div class="pd-empty">⚠️ データの取得に失敗しました: ${e.message}</div>`;
    statusEl.textContent = 'エラー';
    return;
  }

  statusEl.textContent = `${links.length}件`;
  listEl.innerHTML = '';

  if (!links.length) {
    listEl.innerHTML = `<div class="pd-empty">まだリンクが登録されていません</div>`;
    return;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  links.forEach((url, i) => {
    const el = document.createElement('div');
    el.className = 'pd-item';
    el.innerHTML = `
      <span class="pd-num">${i + 1}</span>
      <span class="pd-item-url">
        <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>
      </span>
      <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="pd-open-btn">開く</a>
    `;
    listEl.appendChild(el);
  });
})();
</script>
{% endblock %}
